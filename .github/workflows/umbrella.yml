name: Umbrella Integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify submodule layout and shell syntax
        run: |
          ./build.sh validate
      - name: Verify umbrella cross-repo resolution for core/lib.sh across all targets
        run: |
          TMP="$(mktemp -d)"
          check_profile() {
            local dev="$1" want_src="$2" want_rel="$3" want_boot="$4" want_img="$5"
            (
              export BUILD_ROOT="$TMP/build"
              export HAYATO_ROOT_DIR="$PWD"
              export DEVICE="$dev"
              . ./core/scripts/lib.sh
              [ "$KERNEL_SOURCE_TYPE" = "$want_src" ]
              [ "$KERNEL_RELEASE" = "$want_rel" ]
              [ "$BOOT_TYPE" = "$want_boot" ]
              [ "$IMAGE_SIZE_MIB" = "$want_img" ]
              [ -d "$DEVICES_DIR/$dev" ]
              [ -d "$UI_DIR/files" ]
              echo "Umbrella lib.sh OK: $DEVICE source=$KERNEL_SOURCE_TYPE rel=$KERNEL_RELEASE boot=$BOOT_TYPE img=${IMAGE_SIZE_MIB}MiB"
            )
          }
          check_profile google-asurada source 7.2.7-mt81 depthcharge 6144
          check_profile google-kukui source 7.2.7-mt81 depthcharge 6144
          check_profile arm64-uefi debian-pkg debian-pkg uefi 8192
          check_profile arm64-extlinux debian-pkg debian-pkg extlinux 8192
          [ "$(cat VERSION)" = "$(cat core/VERSION)" ]
          [ "$(cat VERSION)" = "$(cat desktop/VERSION)" ]
          rm -rf "$TMP"
      - name: Verify Pages assembly paths
        run: |
          test -f site/index.html
          test -f desktop/brand/hayato.svg
          test -f desktop/brand/social-preview.png
          test -f desktop/brand/apple-touch-icon.png
