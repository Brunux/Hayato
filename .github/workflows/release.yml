name: Build release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tag matches VERSION, submodules, and release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="v$(tr -d '\n' < VERSION)"
          if [ "$tag" != "$expected" ]; then
            echo "tag $tag does not match VERSION ($expected)"
            exit 1
          fi
          for vfile in core/VERSION desktop/VERSION; do
            subver="v$(tr -d '\n' < "$vfile")"
            if [ "$tag" != "$subver" ]; then
              echo "tag $tag does not match $vfile ($subver)"
              exit 1
            fi
          done
          if [ ! -f "docs/releases/$tag.md" ]; then
            echo "docs/releases/$tag.md is missing (it is the release body)"
            exit 1
          fi

  build:
    needs: verify-tag
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build tools
        run: sudo ./core/scripts/00-deps.sh
      - name: Free space for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - name: Build rootfs and images
        run: |
          export BUILD_ROOT=/var/tmp/lazyos-build
          sudo -E ./build.sh all
          sudo -E ./build.sh release "$PWD/out"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/*.img.xz \
            out/*-rootfs.tar.zst \
            out/*.vmlinuz.kpart \
            out/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag
