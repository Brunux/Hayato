name: Build release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Release target (all, google-asurada, google-kukui, arm64-uefi, arm64-extlinux)"
        required: true
        default: "all"
      publish:
        description: "Publish GitHub release if running on a v* tag"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      need_mt81_kernel: ${{ steps.plan.outputs.need_mt81_kernel }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify versions or umbrella validation
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            expected="v$(tr -d '\n' < VERSION)"
            if [ "$tag" != "$expected" ]; then
              echo "tag $tag does not match VERSION ($expected)"
              exit 1
            fi
            for vfile in core/VERSION desktop/VERSION; do
              subver="v$(tr -d '\n' < "$vfile")"
              if [ "$tag" != "$subver" ]; then
                echo "tag $tag does not match $vfile ($subver)"
                exit 1
              fi
            done
            if [ ! -f "docs/releases/$tag.md" ]; then
              echo "docs/releases/$tag.md is missing (it is the release body)"
              exit 1
            fi
            targets='["google-asurada","google-kukui","arm64-uefi","arm64-extlinux"]'
            need_mt81_kernel="true"
            should_publish="true"
          else
            ./build.sh validate
            case "${{ github.event.inputs.target }}" in
              all)
                targets='["google-asurada","google-kukui","arm64-uefi","arm64-extlinux"]'
                need_mt81_kernel="true"
                ;;
              google-asurada|google-kukui)
                targets='["${{ github.event.inputs.target }}"]'
                need_mt81_kernel="true"
                ;;
              arm64-uefi|arm64-extlinux)
                targets='["${{ github.event.inputs.target }}"]'
                need_mt81_kernel="false"
                ;;
              *)
                echo "Unsupported target: ${{ github.event.inputs.target }}"
                exit 1
                ;;
            esac
            should_publish="false"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "need_mt81_kernel=$need_mt81_kernel" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: verify
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:forky
    steps:
      - name: Prepare the forky container
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl xz-utils zstd nodejs
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build dependencies
        run: ./core/scripts/00-deps.sh
      - name: Free space for shared desktop build
        run: |
          df -h
      - name: Build shared desktop once (swayfx, workstyle, hayato)
        run: |
          export BUILD_ROOT=/var/tmp/hayato-build
          ./build.sh desktop
          mkdir -p stages
          tar -C "$BUILD_ROOT/work" --numeric-owner -cpf - swayfx-stage workstyle-stage hayato-stage | zstd -T0 -6 -q -o stages/desktop-stages.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-stages
          path: stages/desktop-stages.tar.zst
          retention-days: 2

  build-mt81-kernel:
    needs: verify
    if: needs.verify.outputs.need_mt81_kernel == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:forky
    steps:
      - name: Prepare the forky container
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl xz-utils zstd nodejs
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build dependencies
        run: ./core/scripts/00-deps.sh
      - name: Free space for mediatek-mt81 kernel build
        run: |
          df -h
      - name: Build mediatek-mt81 kernel once (google-asurada & google-kukui)
        run: |
          export BUILD_ROOT=/var/tmp/hayato-build
          DEVICE=google-asurada ./build.sh kernel
          mkdir -p stages
          tar -C "$BUILD_ROOT/work" --numeric-owner -cpf - kernel-stage-mediatek-mt81 | zstd -T0 -6 -q -o stages/mt81-kernel-stage.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: mt81-kernel-stage
          path: stages/mt81-kernel-stage.tar.zst
          retention-days: 2

  build-target:
    needs: [verify, build-desktop, build-mt81-kernel]
    if: ${{ !failure() && !cancelled() && needs.verify.result == 'success' && needs.build-desktop.result == 'success' && (needs.build-mt81-kernel.result == 'success' || needs.build-mt81-kernel.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:forky
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.verify.outputs.targets) }}
    steps:
      - name: Prepare the forky container
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl xz-utils zstd nodejs
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build dependencies
        run: ./core/scripts/00-deps.sh
      - name: Free space for target assembly
        run: |
          df -h
      - uses: actions/download-artifact@v4
        with:
          name: desktop-stages
          path: stages
      - uses: actions/download-artifact@v4
        if: matrix.target == 'google-asurada' || matrix.target == 'google-kukui'
        with:
          name: mt81-kernel-stage
          path: stages
      - name: Assemble rootfs, images, and release archive
        run: |
          export BUILD_ROOT=/var/tmp/hayato-build
          mkdir -p "$BUILD_ROOT/work"
          tar -C "$BUILD_ROOT/work" --numeric-owner -I zstd -xf stages/desktop-stages.tar.zst
          if [ -f stages/mt81-kernel-stage.tar.zst ]; then
            tar -C "$BUILD_ROOT/work" --numeric-owner -I zstd -xf stages/mt81-kernel-stage.tar.zst
          fi
          export DEVICE="${{ matrix.target }}"
          export SKIP_DESKTOP_BUILD=yes
          export SKIP_KERNEL_BUILD=yes
          ./build.sh all
          ./build.sh release "$PWD/out-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: out-${{ matrix.target }}/*
          retention-days: 7

  publish:
    needs: [verify, build-target]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out-all
          merge-multiple: true
      - name: Build APT repository metadata and unified SHA256SUMS
        env:
          HAYATO_APT_GPG_PRIVATE_KEY: ${{ secrets.HAYATO_APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p release-files
          find out-all -type f ! -name 'SHA256SUMS' ! -name 'MERGED_SUMS' -exec mv -f -t release-files {} +
          chmod +x ./core/scripts/hayato-apt.sh
          ./core/scripts/hayato-apt.sh build-repo release-files
          # Recompute clean combined SHA256SUMS across all shipped images, .debs, and APT metadata
          (
            cd release-files
            rm -f SHA256SUMS
            sha256sum * > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ls -lh release-files
      - uses: actions/upload-artifact@v4
        if: needs.verify.outputs.should_publish != 'true'
        with:
          name: hayato-release-preview
          path: release-files/*
          retention-days: 7
      - name: Publish GitHub Release
        if: needs.verify.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release may already exist: the first target is often cut by hand
          # before the tag, and the pipeline then adds the rest.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-files/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              --verify-tag
          fi
      - name: Push .deb packages to Cloudsmith APT repository
        if: needs.verify.outputs.should_publish == 'true'
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO || 'brunux/hayato' }}
        run: |
          if [ -z "${CLOUDSMITH_API_KEY:-}" ]; then
            echo "CLOUDSMITH_API_KEY secret is not set; skipping Cloudsmith push (packages are archived on GitHub Release)."
            exit 0
          fi
          pipx install cloudsmith-cli || pip install --user cloudsmith-cli
          export PATH="$HOME/.local/bin:$PATH"
          for deb in release-files/*.deb; do
            [ -f "$deb" ] || continue
            cloudsmith push deb "${CLOUDSMITH_REPO}/debian/forky" "$deb" --republish --no-wait-for-sync
          done
