name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "desktop"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Assemble site
        run: |
          rm -rf _site
          cp -a site _site
          mkdir -p _site/brand _site/screenshots
          cp desktop/brand/hayato.svg desktop/brand/social-preview.png _site/brand/
          [ -f desktop/brand/apple-touch-icon.png ] && cp desktop/brand/apple-touch-icon.png _site/apple-touch-icon.png
          cp docs/screenshots/*.png _site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
